name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest --cov=youtube_mcp --cov-report=term-missing

  docker:
    name: Build & smoke-test image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: youtube-metadata-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --name mcp -p 5000:5000 youtube-metadata-mcp:ci
          trap 'docker logs mcp || true; docker rm -f mcp || true' EXIT

          echo "Waiting for /health to return 200..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "Healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Container did not become healthy within 30s"
          exit 1

      - name: Smoke test - SSE accepts a proxied Host header
        run: |
          docker run -d --name mcp-sse -p 5001:5000 youtube-metadata-mcp:ci
          trap 'docker rm -f mcp-sse || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5001/health && break
            sleep 1
          done
          # Behind the reverse proxy every request carries the public Host header.
          # The MCP SDK's default rejects it with 421; /sse must answer 200.
          code=$(curl -s -o /dev/null -m 3 -w '%{http_code}' -H 'Host: mcp.example.org' http://127.0.0.1:5001/sse || true)
          echo "GET /sse with public Host -> ${code}"
          test "$code" = "200"

      - name: Smoke test - yt-dlp available
        run: docker run --rm --entrypoint python youtube-metadata-mcp:ci -m yt_dlp --version

      - name: Smoke test - deno available
        run: docker run --rm --entrypoint deno youtube-metadata-mcp:ci --version
