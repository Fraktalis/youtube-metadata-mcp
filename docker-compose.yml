services:
  app:
    container_name: youtube-metadata-mcp

    # Local dev: build from source.
    build: .
    # Production alternative: pull the published, version-pinned image from
    # GHCR instead of building locally (never :latest — pin an exact tag).
    # image: ghcr.io/fraktalis/youtube-metadata-mcp:X.Y.Z

    restart: unless-stopped

    ports:
      - "5000:5000"

    labels:
      # Auth and TLS are handled by the reverse proxy in front of this
      # service; the app itself has no auth of its own.
      - "wud.watch=false"
