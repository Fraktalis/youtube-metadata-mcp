[project]
name = "youtube-metadata-mcp"
version = "2.0.0"
description = "MCP server exposing YouTube transcript and metadata tools via yt-dlp"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.2.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "webvtt-py==0.5.1",
    "yt-dlp[default,deno]==2026.8.19",
    "anyio==4.15.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["youtube_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = [
    "network: tests that hit the real network/YouTube (deselected by default)",
]

[tool.coverage.run]
source = ["youtube_mcp"]
